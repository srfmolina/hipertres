[package]
name = "hipertres"
version = "0.1.0"
edition = "2024"
authors = ["Serafín López Molina (srfmolina)"]
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.19.1"

# Recommended by the Bevy quick-start guide: light optimizations for our code,
# full optimizations for dependencies (Bevy is very slow at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
